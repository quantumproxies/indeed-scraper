[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-indeed-scraper"
version = "0.1.0"
description = "Indeed scraper for Python and the command line: job listings for a role and location with structured salary ranges, benefits, employer rating and posting date, as JSON or CSV. Free and open source; sign in with your QuanticData account, no browser extension, proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["indeed-scraper", "indeed", "indeed-api", "indeed-jobs", "indeed-job-scraper", "job-scraper", "jobs-api", "job-listings", "salary-data", "recruiting", "n8n", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
indeed-scraper = "quanticdata_indeed_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/indeed-jobs-api/?utm_source=github&utm_medium=pypi&utm_campaign=indeed-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/indeed-scraper"
Issues = "https://github.com/quantumproxies/indeed-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_indeed_scraper" = ["spec.json", "py.typed"]
